<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Flappy Gap — Playable</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>
  <div id="hud"><span class="pill" id="progress-label">Passed: 0 / 10</span></div>
  <div id="hand-hint" aria-hidden="true"><img id="hand-img" alt="" width="256" height="256"></div>
  <div id="tap-layer"></div>

  <div id="overlay-win" class="overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="overlay-card">
      <h2 id="win-title">Nice flying!</h2>
      <p>You cleared 10 gaps.</p>
      <div class="overlay-actions">
        <button type="button" class="btn btn-primary" id="btn-download-win">Download now</button>
      </div>
    </div>
  </div>

  <div id="overlay-lose" class="overlay" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <div class="overlay-card">
      <h2 id="lose-title">Game over</h2>
      <p>Tap retry or download.</p>
      <div class="overlay-actions row">
        <button type="button" class="btn btn-secondary" id="btn-retry">Retry</button>
        <button type="button" class="btn btn-primary" id="btn-download-lose">Download now</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
